name: Publish NuGet
on: workflow_dispatch

jobs:
  publish:
    name: Build, Pack & Publish
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Install dependencies
      run: dotnet restore Leash.slnx
    - name: Build
      run: dotnet build Leash.slnx --configuration Release --no-restore
    - name: Test
      run: dotnet test --solution Leash.slnx --configuration Release --no-build --no-restore --verbosity normal

    - name: Package
      run: dotnet pack Leash/Leash.csproj --configuration Release --no-build --no-restore --output bin
    - name: Publish
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      run: dotnet nuget push "bin/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
